name: Add animal clip

on:
  workflow_dispatch:
    inputs:
      animal_name:
        description: Animal name in English
        required: true
        type: string
      youtube_short_url:
        description: YouTube Short URL
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - content/catalog.json
      - scripts/content/**
      - .github/workflows/content.yml

concurrency:
  group: animal-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish content
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Restore processed media cache
        uses: actions/cache@v6.1.0
        with:
          path: .content-cache
          key: content-v1-${{ github.run_id }}
          restore-keys: |
            content-v1-

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check yt-dlp==2026.8.19

      - name: Start download proxy
        run: |
          docker run --detach \
            --name warp \
            --publish 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp@sha256:d50d29d859bd437420bf63256f803e9fac28657c346b6f5ba50e21ffeb93dff2
          for _ in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 \
              --proxy socks5h://127.0.0.1:1080 \
              https://www.cloudflare.com/cdn-cgi/trace | grep --quiet 'warp=on'; then
              exit 0
            fi
            sleep 3
          done
          docker logs warp
          exit 1

      - name: Add requested clip
        if: github.event_name == 'workflow_dispatch'
        env:
          ANIMAL_NAME: ${{ inputs.animal_name }}
          SHORT_URL: ${{ inputs.youtube_short_url }}
        run: |
          python scripts/content/add_clip.py \
            --catalog content/catalog.json \
            --animal "$ANIMAL_NAME" \
            --url "$SHORT_URL"

      - name: Build content
        env:
          YTDLP_PROXY: socks5://127.0.0.1:1080
        run: |
          rm -rf dist/content
          python scripts/content/build_content.py \
            --catalog content/catalog.json \
            --output dist/content \
            --cache .content-cache \
            --release-base https://github.com/clentfort/miau-muh-und-mehr/releases/download/content

      - name: Create rolling content release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view content >/dev/null 2>&1; then
            gh release create content --title "Animal content" --notes "Generated media for Miau, Muh und mehr"
          fi
          gh release upload content dist/content/* --clobber

      - name: Commit generated catalog and manifest
        run: |
          cp dist/content/manifest.json content/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json content/manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(content): publish animal clips"
          git push
