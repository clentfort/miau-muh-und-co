name: Add animal clip

on:
  workflow_dispatch:
    inputs:
      animal_name:
        description: Animal name in English
        required: true
        type: string
      youtube_short_url:
        description: YouTube Short URL
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - content/catalog.json
      - scripts/content/**
      - .github/workflows/content.yml

concurrency:
  group: animal-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish content
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore processed media cache
        uses: actions/cache@v4
        with:
          path: .content-cache
          key: content-v1-${{ github.run_id }}
          restore-keys: |
            content-v1-

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp==2026.8.19

      - name: Add requested clip
        if: github.event_name == 'workflow_dispatch'
        env:
          ANIMAL_NAME: ${{ inputs.animal_name }}
          SHORT_URL: ${{ inputs.youtube_short_url }}
        run: |
          python scripts/content/add_clip.py \
            --catalog content/catalog.json \
            --animal "$ANIMAL_NAME" \
            --url "$SHORT_URL"

      - name: Build content
        run: |
          rm -rf dist/content
          python scripts/content/build_content.py \
            --catalog content/catalog.json \
            --output dist/content \
            --cache .content-cache \
            --release-base https://github.com/clentfort/miau-muh-und-co/releases/download/content

      - name: Create rolling content release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view content >/dev/null 2>&1; then
            gh release create content --title "Animal content" --notes "Generated media for Miau, Muh und Co"
          fi
          gh release upload content dist/content/* --clobber

      - name: Commit generated catalog and manifest
        run: |
          cp dist/content/manifest.json content/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json content/manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(content): publish animal clips"
          git push
