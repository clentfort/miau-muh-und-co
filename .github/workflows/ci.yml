name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s scripts/content -p "test_*.py"
